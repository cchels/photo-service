AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Two Lambda functions with inline code:
    - index-photos (handler: lambda_function.lambda_handler)
    - search-photos (same handler)

Resources:
  IndexPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: index-photos
      Runtime: python3.10
      Handler: lambda_function.lambda_handler
      Role: !ImportValue PhotoAlbum-IndexRoleArn
      Environment:
        Variables:
          PHOTO_BUCKET: !ImportValue PhotoAlbum-PhotoBucketName
      Code:
        ZipFile: |
          import os, json, base64, boto3
          s3 = boto3.client('s3')
          def lambda_handler(event, context):
              bucket = os.environ['PHOTO_BUCKET']
              body   = event.get('body') or ''
              # decode base64-encoded image from API Gateway
              image = base64.b64decode(body)
              key   = 'uploaded-' + context.aws_request_id + '.jpg'
              s3.put_object(Bucket=bucket, Key=key, Body=image)
              return {
                  'statusCode': 200,
                  'body': json.dumps({'key': key})
              }

  SearchPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: search-photos
      Runtime: python3.10
      Handler: lambda_function.lambda_handler
      Role: !ImportValue PhotoAlbum-SearchRoleArn
      Environment:
        Variables:
          PHOTO_BUCKET: !ImportValue PhotoAlbum-PhotoBucketName
      Code:
        ZipFile: |
          import os, json, boto3
          s3 = boto3.client('s3')
          def lambda_handler(event, context):
              bucket = os.environ['PHOTO_BUCKET']
              q      = event.get('queryStringParameters', {}).get('q','')
              # list with prefix if q given
              resp = s3.list_objects_v2(Bucket=bucket, Prefix=q) \
                         .get('Contents', [])
              keys = [obj['Key'] for obj in resp]
              return {
                  'statusCode': 200,
                  'body': json.dumps({'results': keys})
              }

Outputs:
  IndexFunctionArn:
    Value: !GetAtt IndexPhotosFunction.Arn
    Export:
      Name: PhotoAlbum-IndexFunctionArn

  SearchFunctionArn:
    Value: !GetAtt SearchPhotosFunction.Arn
    Export:
      Name: PhotoAlbum-SearchFunctionArn
